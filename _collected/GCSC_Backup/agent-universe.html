const bgCanvas = document.getElementById('bg');
const bgCtx = bgCanvas.getContext('2d');
bgCanvas.width = window.innerWidth;
bgCanvas.height = window.innerHeight;

const stars = Array.from({length:300}, () => ({
  x: Math.random() * bgCanvas.width,
  y: Math.random() * bgCanvas.height,
  r: Math.random() * 1.5,
  a: Math.random(),
  da: (Math.random() - 0.5) * 0.005
}));

function drawBg() {
  bgCtx.fillStyle = '#000005';
  bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

  // Nebula
  const grad = bgCtx.createRadialGradient(bgCanvas.width/2, bgCanvas.height/2, 0, bgCanvas.width/2, bgCanvas.height/2, bgCanvas.width*0.6);
  grad.addColorStop(0, 'rgba(0,30,60,0.3)');
  grad.addColorStop(0.5, 'rgba(0,10,30,0.2)');
  grad.addColorStop(1, 'rgba(0,0,0,0)');
  bgCtx.fillStyle = grad;
  bgCtx.fillRect(0,0,bgCanvas.width,bgCanvas.height);

  stars.forEach(s => {
    s.a += s.da;
    if(s.a > 1) s.a = 1, s.da *= -1;
    if(s.a < 0.1) s.a = 0.1, s.da *= -1;
    bgCtx.beginPath();
    bgCtx.arc(s.x, s.y, s.r, 0, Math.PI*2);
    bgCtx.fillStyle = `rgba(255,255,255,${s.a})`;
    bgCtx.fill();
  });
  requestAnimationFrame(drawBg);
}

// ═══════════════════════════════════════════
// UNIVERSE RENDERER (SVG-based)
// ═══════════════════════════════════════════
const SVG_NS = 'http://www.w3.org/2000/svg';
const universe = document.getElementById('universe');

const svg = document.createElementNS(SVG_NS, 'svg');
svg.setAttribute('width', '100%');
svg.setAttribute('height', '100%');
universe.appendChild(svg);

// Defs
const defs = document.createElementNS(SVG_NS, 'defs');
svg.appendChild(defs);

// Glow filter
function makeGlow(id, color) {
  const filter = document.createElementNS(SVG_NS, 'filter');
  filter.setAttribute('id', id);
  filter.setAttribute('x', '-50%'); filter.setAttribute('y', '-50%');
  filter.setAttribute('width', '200%'); filter.setAttribute('height', '200%');
  const blur = document.createElementNS(SVG_NS, 'feGaussianBlur');
  blur.setAttribute('in', 'SourceGraphic');
  blur.setAttribute('stdDeviation', '4');
  blur.setAttribute('result', 'blur');
  const flood = document.createElementNS(SVG_NS, 'feFlood');
  flood.setAttribute('flood-color', color);
  flood.setAttribute('flood-opacity', '0.6');
  flood.setAttribute('result', 'color');
  const comp = document.createElementNS(SVG_NS, 'feComposite');
  comp.setAttribute('in', 'color');
  comp.setAttribute('in2', 'blur');
  comp.setAttribute('operator', 'in');
  comp.setAttribute('result', 'coloredBlur');
  const merge = document.createElementNS(SVG_NS, 'feMerge');
  const n1 = document.createElementNS(SVG_NS, 'feMergeNode');
  n1.setAttribute('in', 'coloredBlur');
  const n2 = document.createElementNS(SVG_NS, 'feMergeNode');
  n2.setAttribute('in', 'SourceGraphic');
  merge.appendChild(n1); merge.appendChild(n2);
  filter.appendChild(blur); filter.appendChild(flood); filter.appendChild(comp); filter.appendChild(merge);
  defs.appendChild(filter);
}

const glowColors = {
  'AI Core': '#f59e0b',
  'GCSC Agent': '#00d4ff',
  'Document Skill': '#00ff88',
  'Creative Skill': '#a855f7',
  'SPRUT Agent': '#f97316',
  'Communication': '#ec4899'
};

Object.entries(glowColors).forEach(([k,v]) => makeGlow('glow-' + k.replace(/\s+/g,''), v));

// Orbit radii
const ORBIT_R = [0, 110, 195, 275, 355, 430];

// Center
let CX = window.innerWidth / 2;
let CY = window.innerHeight / 2;

// Draw orbit rings
ORBIT_R.slice(1).forEach(r => {
  const circle = document.createElementNS(SVG_NS, 'circle');
  circle.setAttribute('cx', CX);
  circle.setAttribute('cy', CY);
  circle.setAttribute('r', r);
  circle.setAttribute('fill', 'none');
  circle.setAttribute('stroke', 'rgba(255,255,255,0.04)');
  circle.setAttribute('stroke-width', '1');
  circle.setAttribute('stroke-dasharray', '4,8');
  svg.appendChild(circle);
});

// Planet DOM elements
const planetEls = {};
const angles = {};

PLANETS.forEach(p => {
  angles[p.id] = (p.angle * Math.PI) / 180;

  const g = document.createElementNS(SVG_NS, 'g');
  g.setAttribute('cursor', 'pointer');
  g.style.transition = 'transform 0.1s';

  const filterId = 'glow-' + p.category.replace(/\s+/g,'');

  // Outer glow ring
  if (p.id !== 'core') {
    const ring = document.createElementNS(SVG_NS, 'circle');
    ring.setAttribute('r', p.size + 6);
    ring.setAttribute('fill', 'none');
    ring.setAttribute('stroke', p.color);
    ring.setAttribute('stroke-width', '1');
    ring.setAttribute('opacity', '0.25');
    g.appendChild(ring);
  }

  // Main circle (gradient)
  const gradId = 'grad-' + p.id;
  const grad = document.createElementNS(SVG_NS, 'radialGradient');
  grad.setAttribute('id', gradId);
  grad.setAttribute('cx', '35%'); grad.setAttribute('cy', '35%');
  grad.setAttribute('r', '65%');
  const stop1 = document.createElementNS(SVG_NS, 'stop');
  stop1.setAttribute('offset', '0%');
  stop1.setAttribute('stop-color', lighten(p.color, 80));
  const stop2 = document.createElementNS(SVG_NS, 'stop');
  stop2.setAttribute('offset', '100%');
  stop2.setAttribute('stop-color', darken(p.color, 40));
  grad.appendChild(stop1); grad.appendChild(stop2);
  defs.appendChild(grad);

  const circle = document.createElementNS(SVG_NS, 'circle');
  circle.setAttribute('r', p.size);
  circle.setAttribute('fill', `url(#${gradId})`);
  circle.setAttribute('filter', `url(#${filterId})`);
  g.appendChild(circle);

  // Label
  if (p.size >= 17) {
    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('dy', p.id === 'core' ? '5px' : '4px');
    text.setAttribute('fill', '#fff');
    text.setAttribute('font-size', p.id === 'core' ? '10px' : '8px');
    text.setAttribute('font-weight', '700');
    text.setAttribute('font-family', 'Segoe UI, system-ui, sans-serif');
    text.setAttribute('pointer-events', 'none');
    text.textContent = p.id === 'core' ? '✦' : p.name.substring(0,5);
    g.appendChild(text);
  }

  // Hover events
  g.addEventListener('mouseenter', (e) => {
    showTooltip(e, p);
    g.setAttribute('transform', g.getAttribute('transform') + ' scale(1.15)');
    circle.setAttribute('stroke', p.color);
    circle.setAttribute('stroke-width', '2');
  });
  g.addEventListener('mouseleave', () => {
    hideTooltip();
    circle.removeAttribute('stroke');
    // transform will be reset in animate
  });
  g.addEventListener('click', () => openPanel(p));

  svg.appendChild(g);
  planetEls[p.id] = g;
});

function lighten(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.min(255, (num >> 16) + amount);
  const g = Math.min(255, ((num >> 8) & 0xFF) + amount);
  const b = Math.min(255, (num & 0xFF) + amount);
  return `rgb(${r},${g},${b})`;
}

function darken(hex, amount) {
  const num = parseInt(hex.slice(1), 16);
  const r = Math.max(0, (num >> 16) - amount);
  const g = Math.max(0, ((num >> 8) & 0xFF) - amount);
  const b = Math.max(0, (num & 0xFF) - amount);
  return `rgb(${r},${g},${b})`;
}

// ═══════════════════════════════════════════
// ANIMATION
// ═══════════════════════════════════════════
let hoveredId = null;

function animate() {
  PLANETS.forEach(p => {
    angles[p.id] += p.speed;

    const r = ORBIT_R[p.orbit];
    const x = CX + r * Math.cos(angles[p.id]);
    const y = CY + r * Math.sin(angles[p.id]);

    const g = planetEls[p.id];
    if (hoveredId === p.id) {
      g.setAttribute('transform', `translate(${x},${y}) scale(1.15)`);
    } else {
      g.setAttribute('transform', `translate(${x},${y})`);
    }
  });
  requestAnimationFrame(animate);
}
animate();

// ═══════════════════════════════════════════
// TOOLTIP
// ═══════════════════════════════════════════
const tooltip = document.getElementById('tooltip');
const ttName = document.getElementById('tt-name');
const ttCat = document.getElementById('tt-cat');

function showTooltip(e, p) {
  ttName.textContent = p.name;
  ttCat.textContent = p.category + ' — ' + p.tagline;
  tooltip.style.opacity = '1';
  hoveredId = p.id;
}

function hideTooltip() {
  tooltip.style.opacity = '0';
  hoveredId = null;
}

document.addEventListener('mousemove', (e) => {
  tooltip.style.left = (e.clientX + 16) + 'px';
  tooltip.style.top = (e.clientY - 10) + 'px';
});

// ═══════════════════════════════════════════
// SIDE PANEL
// ═══════════════════════════════════════════
const panel = document.getElementById('panel');
const pCat = document.getElementById('p-cat');
const pName = document.getElementById('p-name');
const pTagline = document.getElementById('p-tagline');
const pDesc = document.getElementById('p-desc');
const pFeatures = document.getElementById('p-features');
const pBtn = document.getElementById('p-btn');

const categoryColors = {
  'AI Core': '#f59e0b',
  'GCSC Agent': '#00d4ff',
  'Document Skill': '#00ff88',
  'Creative Skill': '#a855f7',
  'SPRUT Agent': '#f97316',
  'Communication': '#ec4899'
};

function openPanel(p) {
  pCat.textContent = p.category;
  pCat.style.color = categoryColors[p.category] || '#00d4ff';
  pName.textContent = p.name;
  pName.style.color = p.color;
  pTagline.textContent = p.tagline;
  pDesc.textContent = p.desc;
  pFeatures.innerHTML = p.features.map(f => `<li>${f}</li>`).join('');
  pBtn.textContent = p.category === 'GCSC Agent' ? '⚡ Запустить агента' : p.category === 'SPRUT Agent' ? '🤖 Активировать' : '📄 Использовать навык';
  panel.classList.add('open');
}

document.getElementById('panel-close').addEventListener('click', () => {
  panel.classList.remove('open');
});

// Close panel on escape
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') panel.classList.remove('open');
});

// ═══════════════════════════════════════════
// RESIZE
// ═══════════════════════════════════════════
window.addEventListener('resize', () => {
  CX = window.innerWidth / 2;
  CY = window.innerHeight / 2;
  bgCanvas.width = window.innerWidth;
  bgCanvas.height = window.innerHeight;

  // Update orbit rings
  svg.querySelectorAll('circle[stroke-dasharray]').forEach((c, i) => {
    c.setAttribute('cx', CX);
    c.setAttribute('cy', CY);
  });
});

// ═══════════════════════════════════════════
// CONNECTION LINES (on hover — orbit mates)
// ═══════════════════════════════════════════
const linesGroup = document.createElementNS(SVG_NS, 'g');
linesGroup.setAttribute('opacity', '0');
linesGroup.style.transition = 'opacity 0.3s';
svg.insertBefore(linesGroup, svg.firstChild.nextSibling);

// Add faint constellation lines between orbit 1 planets (GCSC agents)
function drawConstellations() {
  linesGroup.innerHTML = '';
  const orbit1 = PLANETS.filter(p => p.orbit === 1);
  for(let i = 0; i < orbit1.length; i++) {
    for(let j = i+1; j < orbit1.length; j++) {
      const a = orbit1[i], b = orbit1[j];
      const ax = CX + ORBIT_R[1] * Math.cos(angles[a.id]);
      const ay = CY + ORBIT_R[1] * Math.sin(angles[a.id]);
      const bx = CX + ORBIT_R[1] * Math.cos(angles[b.id]);
      const by = CY + ORBIT_R[1] * Math.sin(angles[b.id]);
      const line = document.createElementNS(SVG_NS, 'line');
      line.setAttribute('x1', ax); line.setAttribute('y1', ay);
      line.setAttribute('x2', bx); line.setAttribute('y2', by);
      line.setAttribute('stroke', 'rgba(0,212,255,0.1)');
      line.setAttribute('stroke-width', '1');
      linesGroup.appendChild(line);
    }
  }
}

// Periodically show constellations
setInterval(() => {
  drawConstellations();
  linesGroup.setAttribute('opacity', '0.8');
  setTimeout(() => linesGroup.setAttribute('opacity', '0'), 2000);
}, 5000);

</script>
