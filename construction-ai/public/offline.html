<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080a12">
  <title>SmartContractor Offline</title>
  <style>
    :root {
      --bg: #080a12;
      --panel: #101421;
      --line: #293145;
      --text: #f4f7fb;
      --muted: #9aa7bd;
      --accent: #23d3a4;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(520px, 100%);
      padding: 28px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    img {
      width: 64px;
      height: 64px;
      object-fit: contain;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 26px;
      line-height: 1.15;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.5;
    }

    a {
      display: inline-flex;
      min-height: 44px;
      align-items: center;
      justify-content: center;
      padding: 0 16px;
      border-radius: 8px;
      background: var(--accent);
      color: #05110e;
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <img src="/gcsc-logo.svg" alt="GCSC">
    <h1>SmartContractor is offline</h1>
    <p>The app shell is installed, but live jobs, bids, loans, payments, and disputes need the backend connection.</p>
    <a href="/smartcontractor.html">Try again</a>
  </main>
</body>
</html>
