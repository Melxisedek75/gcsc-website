<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Glow filters -->
    <filter id="glow-blue" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-purple" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-text" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(124,58,237,0.6)"/>
    </filter>

    <!-- Metallic ring gradient -->
    <linearGradient id="ring-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d0d0d0"/>
      <stop offset="20%" stop-color="#f8f8f8"/>
      <stop offset="40%" stop-color="#a0a0a0"/>
      <stop offset="60%" stop-color="#e8e8e8"/>
      <stop offset="80%" stop-color="#b0b0b0"/>
      <stop offset="100%" stop-color="#d8d8d8"/>
    </linearGradient>

    <!-- Inner dark circle gradient -->
    <radialGradient id="inner-grad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#1a1a3e"/>
      <stop offset="50%" stop-color="#0d0d28"/>
      <stop offset="100%" stop-color="#050510"/>
    </radialGradient>

    <!-- GCSC text gradient -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Orbit gradient -->
    <linearGradient id="orbit1-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.5"/>
    </linearGradient>
    <linearGradient id="orbit2-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ring text path -->
    <path id="ring-text-path" d="M200,200 m-145,0 a145,145 0 1,1 290,0 a145,145 0 1,1 -290,0"/>
  </defs>

  <!-- Outer metallic ring -->
  <circle cx="200" cy="200" r="178" fill="url(#ring-grad)" filter="url(#shadow)"/>

  <!-- Ring border highlight -->
  <circle cx="200" cy="200" r="178" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.5"/>
  <circle cx="200" cy="200" r="162" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>

  <!-- Inner dark circle -->
  <circle cx="200" cy="200" r="162" fill="url(#inner-grad)"/>

  <!-- Subtle inner glow ring -->
  <circle cx="200" cy="200" r="162" fill="none" stroke="rgba(124,58,237,0.3)" stroke-width="2"/>

  <!-- Ring text: GLOBAL CONSTRUCTION SMART CONTRACT -->
  <text font-family="Arial, sans-serif" font-size="13.5" font-weight="700" letter-spacing="3.2" fill="#1a1a1a">
    <textPath href="#ring-text-path" startOffset="4%">GLOBAL CONSTRUCTION SMART CONTRACT</textPath>
  </text>

  <!-- ── Atomic orbits ── -->
  <!-- Orbit 1: tilted ~30deg -->
  <g transform="rotate(30, 200, 200)" filter="url(#glow-purple)">
    <ellipse cx="200" cy="200" rx="120" ry="48" fill="none" stroke="url(#orbit1-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Orbit node top -->
    <circle cx="200" cy="152" r="7" fill="#c084fc" opacity="0.95"/>
    <circle cx="200" cy="152" r="4" fill="#ffffff" opacity="0.7"/>
    <!-- Orbit node bottom -->
    <circle cx="200" cy="248" r="5" fill="#9333ea" opacity="0.8"/>
  </g>

  <!-- Orbit 2: tilted -30deg (cyan/blue) -->
  <g transform="rotate(-30, 200, 200)" filter="url(#glow-blue)">
    <ellipse cx="200" cy="200" rx="120" ry="48" fill="none" stroke="url(#orbit2-grad)" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Orbit node right -->
    <circle cx="320" cy="200" r="7" fill="#38bdf8" opacity="0.95"/>
    <circle cx="320" cy="200" r="4" fill="#ffffff" opacity="0.7"/>
    <!-- Orbit node left -->
    <circle cx="80" cy="200" r="5" fill="#0ea5e9" opacity="0.8"/>
  </g>

  <!-- Orbit 3: vertical -->
  <g filter="url(#glow-purple)">
    <ellipse cx="200" cy="200" rx="48" ry="120" fill="none" stroke="rgba(168,85,247,0.7)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Center nucleus glow -->
  <circle cx="200" cy="200" r="18" fill="rgba(124,58,237,0.25)"/>
  <circle cx="200" cy="200" r="12" fill="rgba(168,85,247,0.4)"/>
  <circle cx="200" cy="200" r="6" fill="rgba(255,255,255,0.15)"/>

  <!-- GCSC text -->
  <text
    x="200" y="218"
    text-anchor="middle"
    font-family="Arial Black, Arial, sans-serif"
    font-size="72"
    font-weight="900"
    letter-spacing="-2"
    fill="url(#text-grad)"
    filter="url(#glow-text)"
  >GCSC</text>

  <!-- Subtle shine on ring top-left -->
  <path d="M 80 105 Q 130 60 190 55" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="3" stroke-linecap="round"/>
</svg>
